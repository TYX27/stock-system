services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stockpass
      POSTGRES_DB: stock_inventory
    ports:
      # Use 5433 on Windows to avoid conflict with local PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
